<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SIGNA# - Ultra Version</title>
    <style id="custom-styles">/* Espaço para CSS dinâmico */</style>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #111; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffcc00; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        #editor { flex: 1; background: #1a1a1a; color: #00ffcc; border: none; padding: 25px; font-size: 16px; outline: none; resize: none; font-family: 'Consolas', monospace; border-right: 1px solid #333; }
        #preview { flex: 1; background: #f4f4f4; color: #333; padding: 30px; overflow-y: auto; }
        .side-bar { width: 280px; background: #050505; padding: 15px; font-size: 13px; border-left: 1px solid #333; display: flex; flex-direction: column; }
        .sig-titulo { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .sig-texto { font-size: 18px; margin-bottom: 8px; }
        .sig-botao { background: #ffcc00; border: none; padding: 12px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; display: block; }
        button.run-btn { background: #ffcc00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 20px; }
        .log { color: #ffcc00; margin-top: 10px; font-family: monospace; flex: 1; overflow-y: auto; border-top: 1px solid #222; padding-top: 10px; }
    </style>
</head>
<body>

<header>
    <div>🚀 <strong>SIGNA# ULTRA</strong></div>
    <button class="run-btn" onclick="executarSigna()">RODAR SCRIPT (CTRL+ENTER)</button>
</header>

<div class="main-container">
    <textarea id="editor" spellcheck="false">@void main #
!! CORES POR NOME !!
*titulo 'Bem-vindo ao Ultra'*
*cor 'titulo' 'red'*

!! CALCULOS !!
&x = 10&
&y = 20&
&total = $x$ + $y$&

*botao 'Calcular'*
*aoClicar '*texto* Resultado: $total$'

!! BLOCO CSS3 !!
<css3>
.sig-titulo { 
    text-transform: uppercase; 
    text-shadow: 2px 2px #ccc; 
}
</css3>

!! BLOCO PHP (SIMULADO) !!
<php>
 echo "Iniciando sistema PHP...";
 $status = "Online";
</php>

*save Downloads*
#</textarea>

    <div id="preview"></div>
    
    <div class="side-bar">
        <strong>TERMINAL & LOGS:</strong>
        <div id="terminal" class="log"></div>
    </div>
</div>

<script>
    function executarSigna() {
        const preview = document.getElementById('preview');
        const terminal = document.getElementById('terminal');
        const customStyles = document.getElementById('custom-styles');
        preview.innerHTML = "";
        terminal.innerHTML = "";
        customStyles.innerHTML = "";

        let codigo = document.getElementById('editor').value;
        let variaveis = {};

        const getVal = (t) => {
            if (!t) return "";
            return t.replace(/\$(.*?)\$/g, (m, n) => variaveis[n.trim()] !== undefined ? variaveis[n.trim()] : m).replace(/'/g, "");
        };

        try {
            // Extrair blocos especiais antes do processamento principal
            codigo = codigo.replace(/<css3>([\s\S]*?)<\/css3>/g, (m, css) => {
                customStyles.innerHTML += css;
                return "";
            });

            codigo = codigo.replace(/<php>([\s\S]*?)<\/php>/g, (m, php) => {
                terminal.innerHTML += `<div style="color:#8892bf">[PHP]: Processando script...</div>`;
                // Simulação de saída PHP no log
                if(php.includes('echo')) {
                    let msg = php.match(/echo "(.*?)"/);
                    if(msg) terminal.innerHTML += `<div style="color:#8892bf">> ${msg[1]}</div>`;
                }
                return "";
            });

            const matchCorpo = codigo.match(/#([\s\S]*?)#/);
            if (!matchCorpo) return;
            
            const linhas = matchCorpo[1].split('\n');

            linhas.forEach(linha => {
                linha = linha.trim();
                if (!linha || linha.startsWith('!!')) return;

                // VARIÁVEIS
                if (linha.startsWith('&') && linha.endsWith('&')) {
                    let partes = linha.slice(1, -1).split('=');
                    let nome = partes[0].trim();
                    let val = partes[1].trim().replace(/\$(.*?)\$/g, (m, n) => variaveis[n.trim()] || 0);
                    try { variaveis[nome] = eval(val); } catch { variaveis[nome] = val.replace(/'/g, ""); }
                }

                // UI
                if (linha.startsWith('*titulo')) {
                    preview.innerHTML += `<div class="sig-titulo">${getVal(linha.match(/'(.*?)'|\$(.*?)\$/)[0])}</div>`;
                }
                if (linha.startsWith('*texto')) {
                    preview.innerHTML += `<div class="sig-texto">${getVal(linha.match(/'(.*?)'|\$(.*?)\$/)[0])}</div>`;
                }
                if (linha.startsWith('*botao')) {
                    preview.innerHTML += `<button class="sig-botao">${getVal(linha.match(/'(.*?)'|\$(.*?)\$/)[0])}</button>`;
                }

                // CLIQUE
                if (linha.startsWith('*aoClicar')) {
                    let acao = linha.match(/'(.*?)'/)[1];
                    let btns = preview.querySelectorAll('.sig-botao');
                    let btn = btns[btns.length - 1];
                    if (btn) btn.onclick = () => {
                        if (acao.includes('*texto*')) {
                            preview.innerHTML += `<div class="sig-texto">${getVal(acao.replace('*texto*', '').trim())}</div>`;
                        }
                    };
                }

                // CORES (Aceita nomes como 'red', 'blue', etc)
                if (linha.startsWith('*cor')) {
                    let partes = linha.match(/'(.*?)'/g);
                    if (partes && partes.length >= 2) {
                        let alvo = partes[0].replace(/'/g, "");
                        let cor = partes[1].replace(/'/g, "");
                        let seletor = alvo === 'titulo' ? '.sig-titulo' : alvo === 'botao' ? '.sig-botao' : '.sig-texto';
                        preview.querySelectorAll(seletor).forEach(el => el.style.color = cor);
                    }
                }

                // SAVE SYSTEM
                if (linha.startsWith('*save Downloads*')) {
                    salvarArquivo(codigo);
                    terminal.innerHTML += `<div style="color:lime">> Arquivo enviado para Downloads!</div>`;
                }
            });
        } catch (e) {
            terminal.innerHTML += `<div style="color:red">Erro: ${e.message}</div>`;
        }
    }

    function salvarArquivo(conteudo) {
        const blob = new Blob([conteudo], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'meu_script_signa.txt';
        link.click();
    }

    document.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') executarSigna();
    });
</script>
</body>
</html>
